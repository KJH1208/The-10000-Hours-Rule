<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/10000hours.css" />
    <link rel="icon" href="img/favicon.ico" />
    <title>1만 시간의 법칙</title>
  </head>
  <body>
    <!-- <main class="main-container"> -->
    <header class="hero">
      <div class="title">
        <img src="./img/title.png" alt="1만 시간의 법칙" />
        <img src="./img/clock.png" alt="뒷배경 시계 아이콘" />
      </div>
      <p class="subtitle">"연습은 어제의 당신보다 당신을 더 낫게 만든다."</p>
    </header>

    <main>
      <section class="intro-section">
        <img src="./img/quotes.png" alt="따옴표" class="quote-icon" />
        <p class="intro-text">
          <strong class="highlight">1만 시간의 법칙</strong>은<br />
          어떤 분야의 전문가가 되기 위해서는<br />
          최소한 <strong class="highlight">1만 시간</strong>의 훈련이 필요하다는
          법칙이다.
        </p>
      </section>

      <section class="calculator">
        <form class="calculatorform" id="calculatorForm">
          <div class="input-group">
            <label for="field" class="input-label">
              나는
              <input
                type="text"
                id="field"
                name="field"
                class="input-field"
                placeholder="예&#41;프로그래밍"
                required
              />
              전문가가 될 것이다.
            </label>
          </div>

          <div class="input-group">
            <label class="input-label">
              그래서 앞으로 매일 하루에
              <input
                type="number"
                id="time"
                name="time"
                class="input-field input-field--small"
                placeholder="예&#41;5시간"
                min="1"
                max="24"
                required
              />
              시간씩 훈련할 것이다.
            </label>
          </div>
          <button type="submit" class="calculate-button" id="calculatebtn">
            나는 며칠 동안 훈련을 해야 1만 시간이 될까?
            <img
              src="./img/click.png"
              alt=""
              class="click-icon"
              aria-hidden="true"
            />
          </button>
        </form>
        <!--입력 결과 -->
        <div class="result-section" id="resultSection" aria-live="polite">
          <p class="result-text">
            당신은
            <strong class="result-value" id="resultField"></strong> 전문가가
            되기 위해서
          </p>
          <p class="result-text">
            대략 <strong class="result-number" id="resultDays"></strong>일 이상
            훈련하셔야 합니다! :&#41;
          </p>
        </div>
      </section>

      <section class="action-btn">
        <div class="actions-section" id="actionSection">
          <button type="button" class="btn btn--primary" id="goBtn">
            훈련하러 가기 GO! GO!
          </button>
          <button type="button" class="btn btn--secondary" id="shareBtn">
            공유하기
          </button>
        </div>

        <!--모달창 구현-->
        <dialog id="cheerDialog">
          <div class="dialog-content">
            <h2>화이팅!!♥♥♥</h2>
            <p>당신의 꿈을 응원합니다!</p>
            <img src="./img/licat.png" alt="응원하는 라이캣 캐릭터" />
            <form method="dialog">
              <button>종료하고 진짜 훈련하러 가기 GO!GO!</button>
            </form>
          </div>
        </dialog>
      </section>
    </main>

    <footer class="footer">
      <img src="./img/logo.png" alt="위니브로고" class="logo" />
      <p class="copyright">
        본 서비스 내 이미지 및 콘텐츠의 저작권은 주식회사 위니브에 있습니다.
        <br />
        수정 및 재배포, 무단 도용 시 법적인 문제가 발생할 수 있습니다.
      </p>
    </footer>
    <script src="./js/10000hours.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const goBtn = document.getElementById("goBtn");
        const dialog = document.getElementById("cheerDialog");

        goBtn.addEventListener("click", () => dialog.showModal());
      });
    </script>
  </body>
</html>
